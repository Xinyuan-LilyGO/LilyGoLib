[platformio]
boards_dir = boards
; Select one hardware environment. T-LoRa Pager SX1262 is enabled by default.
; default_envs = t_embed_plus
; default_envs = t_embed
; default_envs = tdeck_sx1262
; default_envs = tvibe_dev
; default_envs = twatchs3_sx1262
; default_envs = twatchs3_sx1280
; default_envs = twatchs3_cc1101
; default_envs = twatch_ultra_sx1262
; default_envs = twatch_ultra_sx1280
default_envs = tlora_pager_sx1262
; default_envs = tlora_pager_lr1121
; default_envs = tvibe_pager


src_dir = examples/factory
; Change src_dir above to build another example from this repository.

; Pin the pioarduino platform release used to validate LilyGoLib builds.
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = examples/factory/partitions.csv
monitor_filters =
    default
    esp32_exception_decoder
extra_scripts = pre:scripts/platformio_build.py
lib_ldf_mode = chain+
lib_deps =
    LilyGoLib = symlink://.
    lvgl/lvgl @ 9.6.0
    jgromes/RadioLib @ 7.7.1
    lewisxhe/SensorLib @ 0.5.2
    lennarthennigs/Button2 @ 2.7.0
    adafruit/Adafruit PN532 @ 1.3.4
    adafruit/Adafruit BusIO @ 1.17.4
    adafruit/Adafruit TCA8418 @ 1.0.2
    adafruit/Adafruit NeoPixel @ 1.15.5
    lewisxhe/ST25R3916-NFC-RFAL @ 1.0.1
    earlephilhower/ESP8266Audio @ 2.4.1
    h2zero/NimBLE-Arduino @ 2.5.1
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ 1.1.2
    pu2clr/PU2CLR SI4735 @ 2.1.8
    https://github.com/tonhuisman/IRremoteESP8266/archive/refs/heads/feature/C++20-compatibility.zip
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D LILYGO_DEBUG_ENABLED=0
    -D LV_CONF_INCLUDE_SIMPLE
    -I src

[env_s3]
extends = env
board_build.filesystem = fatfs

; T-Embed-Plus (ESP32-S3, 16 MB flash, 8 MB OPI PSRAM)
[env:t_embed_plus]
extends = env_s3
board = lilygo-t-embed-plus
build_flags =
    ${env_s3.build_flags}
    -D ARDUINO_T_EMBED_PLUS
    -D ARDUINO_LILYGO_LORA_CC1101

; T-Embed-Plus V2 (ESP32-S3, 16 MB flash, 8 MB OPI PSRAM)
[env:t_embed_plus_v2]
extends = env_s3
board = lilygo-t-embed-plus-v2
build_flags =
    ${env_s3.build_flags}
    -D ARDUINO_T_EMBED_PLUS_V2
    -D ARDUINO_LILYGO_LORA_CC1101

; Original T-Embed (ESP32-S3, 16 MB flash, 8 MB OPI PSRAM)
[env:t_embed]
extends = env_s3
board = lilygo-t-embed
build_flags =
    ${env_s3.build_flags}
    -D ARDUINO_T_EMBED
    -D RADIOLIB_EXCLUDE_NRF24

; T-Deck (ESP32-S3, 16 MB flash, 8 MB OPI PSRAM)
[env:tdeck_sx1262]
extends = env_s3
board = lilygo-t-deck
build_flags =
    ${env_s3.build_flags}
    -D ARDUINO_T_DECK
    -D ARDUINO_LILYGO_LORA_SX1262

; T-Vibe Dev uses the T-Deck board definition without LoRa or GNSS modules.
[env:tvibe_dev]
extends = env_s3
board = lilygo-t-deck
build_flags =
    ${env_s3.build_flags}
    -D ARDUINO_T_DECK
    -D ARDUINO_T_VIBE_DEV
    -D EXCLUDE_LORA
    -D EXCLUDE_GPS

; T-Watch S3 radio variants
[env_twatchs3]
extends = env_s3
board = lilygo-t-watch-s3
build_flags =
    ${env_s3.build_flags}
    -D ARDUINO_T_WATCH_S3

[env:twatchs3_sx1262]
extends = env_twatchs3
build_flags =
    ${env_twatchs3.build_flags}
    -D ARDUINO_LILYGO_LORA_SX1262

[env:twatchs3_sx1280]
extends = env_twatchs3
build_flags =
    ${env_twatchs3.build_flags}
    -D ARDUINO_LILYGO_LORA_SX1280

[env:twatchs3_cc1101]
extends = env_twatchs3
build_flags =
    ${env_twatchs3.build_flags}
    -D ARDUINO_LILYGO_LORA_CC1101

; T-Watch Ultra radio variants
[env_twatch_ultra]
extends = env
board = lilygo-t-watch-ultra
build_flags =
    ${env.build_flags}
    -D ARDUINO_T_WATCH_S3_ULTRA
    -D EXPANDS_LORA_RF_SW=11
    -D HAS_USB_RF_SWITCH

[env:twatch_ultra_sx1262]
extends = env_twatch_ultra
build_flags =
    ${env_twatch_ultra.build_flags}
    -D ARDUINO_LILYGO_LORA_SX1262

[env:twatch_ultra_sx1280]
extends = env_twatch_ultra
build_flags =
    ${env_twatch_ultra.build_flags}
    -D ARDUINO_LILYGO_LORA_SX1280

; T-LoRa Pager radio variants (8 MB QSPI PSRAM)
[env_tlora_pager]
extends = env_s3
board = lilygo-t-lora-pager
build_flags =
    ${env_s3.build_flags}
    -D ARDUINO_T_LORA_PAGER

[env:tlora_pager_sx1262]
extends = env_tlora_pager
build_flags =
    ${env_tlora_pager.build_flags}
    -D ARDUINO_LILYGO_LORA_SX1262

[env:tlora_pager_lr1121]
extends = env_tlora_pager
build_flags =
    ${env_tlora_pager.build_flags}
    -D ARDUINO_LILYGO_LORA_LR1121

; T-Vibe Pager uses the T-LoRa Pager board definition without a LoRa module.
[env:tvibe_pager]
extends = env_tlora_pager
build_flags =
    ${env_tlora_pager.build_flags}
    -D ARDUINO_T_VIBE_PAGER
    -D EXCLUDE_LORA
